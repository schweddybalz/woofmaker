<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woofmaker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px;
}
h1 { font-size: 2rem; margin-bottom: 4px; letter-spacing: -0.5px; }
.sub { color: #888; font-size: 0.95rem; margin-bottom: 28px; }
#step-upload { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 540px; }
.upload-area {
  border: 2px dashed #444; border-radius: 12px; padding: 40px 32px;
  text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; width: 100%;
}
.upload-area:hover, .upload-area.drag { border-color: #f5c400; background: #1a1800; }
.upload-area p { color: #888; font-size: 0.9rem; margin-top: 8px; }
.upload-area .icon { font-size: 2.5rem; }
#step-adjust { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 540px; }
canvas#preview { width: 100%; border-radius: 8px; background: #111; display: block; }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; width: 100%; margin-top: 16px; }
.ctrl label { display: block; font-size: 0.7rem; color: #888; text-align: center; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.ctrl input[type=range] { width: 100%; accent-color: #f5c400; }
.buttons { display: flex; gap: 10px; margin-top: 18px; width: 100%; }
button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
button:active { transform: scale(0.97); }
#btn-gif { background: #f5c400; color: #000; }
#btn-gif:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
#status { margin-top: 12px; font-size: 0.85rem; color: #aaa; text-align: center; min-height: 20px; }
#step-result { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 540px; }
#step-result img { width: 100%; border-radius: 8px; display: block; }
.result-buttons { display: flex; gap: 10px; margin-top: 16px; width: 100%; }
#btn-download { background: #f5c400; color: #000; text-decoration: none; text-align: center; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; flex: 1; display: block; }
#btn-again { flex: 1; }
</style>
</head>
<body>

<h1>😱 Praul™ Woofmaker</h1>
<p class="sub">BUZZ'S GIRLFRIEND! WOOF!</p>

<div id="step-upload">
  <div class="upload-area" id="drop-zone">
    <div class="icon">📷</div>
    <strong>Choose a photo</strong>
    <p>or drag &amp; drop here</p>
    <input type="file" id="file-input" accept="image/*" style="display:none">
  </div>
</div>

<div id="step-adjust">
  <canvas id="preview" width="540" height="291"></canvas>
  <div class="controls" id="slider-controls">
    <div class="ctrl"><label>Zoom</label><input type="range" id="sl-zoom" min="0.5" max="3" step="0.01" value="1"></div>
    <div class="ctrl"><label>Left / Right</label><input type="range" id="sl-x" min="-200" max="200" step="1" value="0"></div>
    <div class="ctrl"><label>Up / Down</label><input type="range" id="sl-y" min="-200" max="200" step="1" value="0"></div>
  </div>
  <p id="touch-hint" style="display:none;color:#666;font-size:0.8rem;text-align:center;margin-top:10px;">Pinch to zoom · Drag to pan</p>
  <div class="buttons">
    <button id="btn-gif">🎬 Make GIF</button>
    <button class="btn-secondary" id="btn-change">Upload different photo</button>
  </div>
  <div id="status">Adjust sliders then hit Make GIF.</div>
</div>

<div id="step-result">
  <img id="gif-img" src="" alt="Your Woofmaker GIF">
  <div class="result-buttons">
    <a id="btn-download" download="woofmaker.gif">⬇ Download GIF</a>
    <button class="btn-secondary" id="btn-again">🔄 Make another</button>
  </div>
</div>

<script>
// ── GIF Encoder with per-frame median-cut palette ──────────────────────────
class GIFEncoder {
  constructor(w, h) { this.w = w; this.h = h; this.frames = []; }

  addFrame(imageData, delay) {
    const pixels = imageData.data;
    const n = this.w * this.h;
    // Sample pixels for palette (use all for small frames)
    const palette = this._medianCut(pixels, n, 256);
    const indices = new Uint8Array(n);
    // Build fast lookup
    const cache = new Map();
    for (let i = 0; i < n; i++) {
      const r = pixels[i*4], g = pixels[i*4+1], b = pixels[i*4+2];
      const key = (r >> 1) << 14 | (g >> 1) << 7 | (b >> 1);
      let idx = cache.get(key);
      if (idx === undefined) {
        idx = this._nearest(palette, r, g, b);
        cache.set(key, idx);
      }
      indices[i] = idx;
    }
    this.frames.push({ indices, palette, delay: delay || 100 });
  }

  _medianCut(pixels, n, maxColors) {
    // Collect color histogram
    const hist = new Map();
    for (let i = 0; i < n; i++) {
      const r = pixels[i*4] >> 2, g = pixels[i*4+1] >> 2, b = pixels[i*4+2] >> 2;
      const key = r << 12 | g << 6 | b;
      hist.set(key, (hist.get(key) || 0) + 1);
    }
    // Convert to array of [r,g,b,count]
    let colors = [];
    for (const [key, count] of hist) {
      colors.push([(key>>12)<<2, ((key>>6)&63)<<2, (key&63)<<2, count]);
    }
    if (colors.length <= maxColors) {
      const pal = colors.map(c => [c[0],c[1],c[2]]);
      while (pal.length < 256) pal.push([0,0,0]);
      return pal;
    }
    // Median cut
    let buckets = [colors];
    while (buckets.length < maxColors) {
      // Find largest bucket by pixel count
      let bestI = 0, bestCount = 0;
      for (let i = 0; i < buckets.length; i++) {
        const cnt = buckets[i].reduce((s,c) => s+c[3], 0);
        if (cnt > bestCount) { bestCount = cnt; bestI = i; }
      }
      const bucket = buckets[bestI];
      if (bucket.length <= 1) break;
      // Find channel with most range
      let minR=255,maxR=0,minG=255,maxG=0,minB=255,maxB=0;
      for (const [r,g,b] of bucket) {
        if(r<minR)minR=r; if(r>maxR)maxR=r;
        if(g<minG)minG=g; if(g>maxG)maxG=g;
        if(b<minB)minB=b; if(b>maxB)maxB=b;
      }
      const rng = [maxR-minR, maxG-minG, maxB-minB];
      const ch = rng.indexOf(Math.max(...rng));
      bucket.sort((a,b) => a[ch]-b[ch]);
      const mid = Math.floor(bucket.length / 2);
      buckets.splice(bestI, 1, bucket.slice(0, mid), bucket.slice(mid));
    }
    const pal = buckets.map(bucket => {
      let r=0,g=0,b=0,total=0;
      for (const c of bucket) { r+=c[0]*c[3]; g+=c[1]*c[3]; b+=c[2]*c[3]; total+=c[3]; }
      return [Math.round(r/total), Math.round(g/total), Math.round(b/total)];
    });
    while (pal.length < 256) pal.push([0,0,0]);
    return pal;
  }

  _nearest(palette, r, g, b) {
    let best=0, bestD=Infinity;
    for (let i=0; i<palette.length; i++) {
      const dr=r-palette[i][0], dg=g-palette[i][1], db=b-palette[i][2];
      const d=dr*dr*2 + dg*dg*4 + db*db; // weight green more (perceptual)
      if(d<bestD){bestD=d;best=i;}
    }
    return best;
  }

  encode() {
    const out=[], w=this.w, h=this.h;
    const push=b=>out.push(b);
    const pushWord=v=>{out.push(v&0xFF);out.push((v>>8)&0xFF);};
    const pushBytes=a=>{for(const b of a)out.push(b);};
    const pushStr=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i));};

    // Use first frame palette as global
    const gpal = this.frames[0].palette;
    pushStr('GIF89a'); pushWord(w); pushWord(h);
    push(0xF7); push(0); push(0); // global color table, 256 colors
    for(const[r,g,b]of gpal){push(r);push(g);push(b);}

    // Loop forever
    pushBytes([0x21,0xFF,0x0B]); pushStr('NETSCAPE2.0'); pushBytes([0x03,0x01,0x00,0x00,0x00]);

    for(const frame of this.frames){
      const deciSec=Math.round(frame.delay/10);
      pushBytes([0x21,0xF9,0x04,0x00]); pushWord(deciSec); push(0); push(0);

      // Use local color table for each frame for better quality
      push(0x2C); pushWord(0); pushWord(0); pushWord(w); pushWord(h);
      push(0x80|0x07); // local color table, 256 colors
      for(const[r,g,b]of frame.palette){push(r);push(g);push(b);}

      const lzw=this._lzw(frame.indices,8);
      push(8);
      let pos=0;
      while(pos<lzw.length){const blk=lzw.slice(pos,pos+255);push(blk.length);pushBytes(blk);pos+=255;}
      push(0);
    }
    push(0x3B);
    return new Uint8Array(out);
  }

  _lzw(indices, minCodeSize) {
    const clearCode=1<<minCodeSize, eofCode=clearCode+1;
    let codeSize=minCodeSize+1, nextCode=eofCode+1, table=new Map();
    const output=[]; let buf=0, bufBits=0;
    const emit=code=>{buf|=code<<bufBits;bufBits+=codeSize;while(bufBits>=8){output.push(buf&0xFF);buf>>=8;bufBits-=8;}};
    const reset=()=>{table=new Map();for(let i=0;i<clearCode;i++)table.set(''+i,i);codeSize=minCodeSize+1;nextCode=eofCode+1;};
    reset(); emit(clearCode);
    let prefix=''+indices[0];
    for(let i=1;i<indices.length;i++){
      const key=prefix+','+indices[i];
      if(table.has(key)){prefix=key;}
      else{
        emit(table.get(prefix));
        if(nextCode<4096){table.set(key,nextCode++);if(nextCode>(1<<codeSize))codeSize++;}
        else{emit(clearCode);reset();}
        prefix=''+indices[i];
      }
    }
    emit(table.get(prefix)); emit(eofCode);
    if(bufBits>0)output.push(buf&0xFF);
    return output;
  }
}

// Homography
function solve8x8(M,b){
  const n=8,A=M.map((r,i)=>[...r,b[i]]);
  for(let col=0;col<n;col++){
    let mr=col;
    for(let row=col+1;row<n;row++) if(Math.abs(A[row][col])>Math.abs(A[mr][col]))mr=row;
    [A[col],A[mr]]=[A[mr],A[col]];
    for(let row=col+1;row<n;row++){const f=A[row][col]/A[col][col];for(let j=col;j<=n;j++)A[row][j]-=f*A[col][j];}
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){x[i]=A[i][n];for(let j=i+1;j<n;j++)x[i]-=A[i][j]*x[j];x[i]/=A[i][i];}
  return x;
}
function getH(src,dst){
  const M=[],b=[];
  for(let k=0;k<4;k++){
    const[sx,sy]=src[k],[dx,dy]=dst[k];
    M.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]);b.push(dx);
    M.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]);b.push(dy);
  }
  const h=solve8x8(M,b);
  return[[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
}
function invH(H){
  const[[a,b,c],[d,e,f],[g,h,k]]=H,det=a*(e*k-f*h)-b*(d*k-f*g)+c*(d*h-e*g);
  return[[(e*k-f*h)/det,(c*h-b*k)/det,(b*f-c*e)/det],
         [(f*g-d*k)/det,(a*k-c*g)/det,(c*d-a*f)/det],
         [(d*h-e*g)/det,(b*g-a*h)/det,(a*e-b*d)/det]];
}

function warpFaceOnto(bgImg, faceImg, zoom, nudgeX, nudgeY) {
  const c=document.createElement('canvas'); c.width=FW; c.height=FH;
  const ctx=c.getContext('2d');
  const xs=QUAD.map(p=>p[0]),ys=QUAD.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const qw=x1-x0,qh=y1-y0;
  const scale=Math.max(qw/faceImg.naturalWidth,qh/faceImg.naturalHeight)*zoom;
  const nfw=faceImg.naturalWidth*scale,nfh=faceImg.naturalHeight*scale;
  const fc=document.createElement('canvas');fc.width=qw;fc.height=qh;
  const fctx=fc.getContext('2d');
  fctx.drawImage(faceImg,(qw-nfw)/2+nudgeX,(qh-nfh)/2+nudgeY,nfw,nfh);
  const faceData=fctx.getImageData(0,0,qw,qh);
  ctx.drawImage(bgImg,0,0,FW,FH);
  const origData=ctx.getImageData(0,0,FW,FH);
  const out=new ImageData(new Uint8ClampedArray(origData.data),FW,FH);
  const Hi=invH(getH([[0,0],[qw,0],[qw,qh],[0,qh]],QUAD));
  const[r0,r1,r2]=Hi;
  for(let py2=Math.floor(y0);py2<Math.ceil(y1);py2++){
    for(let px2=Math.floor(x0);px2<Math.ceil(x1);px2++){
      const idx=py2*FW+px2;
      if(!FACE_MASK[idx])continue;
      const wx=r0[0]*px2+r0[1]*py2+r0[2],wy=r1[0]*px2+r1[1]*py2+r1[2],ww=r2[0]*px2+r2[1]*py2+r2[2];
      const sx=wx/ww,sy=wy/ww;
      if(sx<0||sx>=qw||sy<0||sy>=qh)continue;
      const si=(Math.round(sy)*qw+Math.round(sx))*4,oi=idx*4;
      out.data[oi]=faceData.data[si];out.data[oi+1]=faceData.data[si+1];
      out.data[oi+2]=faceData.data[si+2];out.data[oi+3]=255;
    }
  }
  ctx.putImageData(out,0,0);
  return c;
}

// ── UI ─────────────────────────────────────────────────────────────────────
const stepUpload=document.getElementById('step-upload');
const stepAdjust=document.getElementById('step-adjust');
const stepResult=document.getElementById('step-result');
const dropZone=document.getElementById('drop-zone');
const fileInput=document.getElementById('file-input');
const previewC=document.getElementById('preview');
const pCtx=previewC.getContext('2d');
const slZoom=document.getElementById('sl-zoom');
const slX=document.getElementById('sl-x');
const slY=document.getElementById('sl-y');
const btnGif=document.getElementById('btn-gif');
const btnChange=document.getElementById('btn-change');
const btnAgain=document.getElementById('btn-again');
const statusEl=document.getElementById('status');
const gifImg=document.getElementById('gif-img');
const btnDownload=document.getElementById('btn-download');

function showStep(s){
  stepUpload.style.display=s==='upload'?'flex':'none';
  stepAdjust.style.display=s==='adjust'?'flex':'none';
  stepResult.style.display=s==='result'?'flex':'none';
}

dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag');handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',()=>handleFile(fileInput.files[0]));
btnChange.addEventListener('click',()=>fileInput.click());
btnAgain.addEventListener('click',()=>{fileInput.value='';showStep('upload');});

let lastFaceImg=null;
function handleFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      lastFaceImg=img;
      slZoom.value=1;slX.value=0;slY.value=0;
      // Reset touch state
      if(typeof zoom!=='undefined'){zoom=1;panX=0;panY=0;}
      statusEl.textContent='Adjust sliders then hit Make GIF.';
      showStep('adjust');
      renderPreview();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderPreview(){
  if(!lastFaceImg||framesLoaded<FRAMES_DATA.length)return;
  pCtx.drawImage(warpFaceOnto(frameImages[frameImages.length-1],lastFaceImg,
    parseFloat(slZoom.value),parseFloat(slX.value),parseFloat(slY.value)),0,0);
}

let db;
[slZoom,slX,slY].forEach(sl=>sl.addEventListener('input',()=>{clearTimeout(db);db=setTimeout(renderPreview,30);}));

// ── Touch gestures (mobile) ───────────────────────────────────────────────
const isMobile = window.matchMedia('(pointer:coarse)').matches;
if (isMobile) {
  document.getElementById('slider-controls').style.display = 'none';
  document.getElementById('touch-hint').style.display = 'block';

  let lastTouches = null;
  let zoom = 1, panX = 0, panY = 0;

  function getTouchState(e) {
    if (e.touches.length === 1) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY, dist: null };
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
        dist: Math.sqrt(dx*dx + dy*dy)
      };
    }
    return null;
  }

  previewC.addEventListener('touchstart', e => {
    e.preventDefault();
    lastTouches = getTouchState(e);
  }, { passive: false });

  previewC.addEventListener('touchmove', e => {
    e.preventDefault();
    const cur = getTouchState(e);
    if (!cur || !lastTouches) return;

    // Pan
    panX += cur.x - lastTouches.x;
    panY += cur.y - lastTouches.y;

    // Pinch zoom
    if (cur.dist && lastTouches.dist) {
      const delta = cur.dist / lastTouches.dist;
      zoom = Math.min(3, Math.max(0.5, zoom * delta));
    }

    lastTouches = cur;

    // Map panX/panY (screen pixels) to image nudge space
    // Preview canvas is 540px wide displayed at device width
    const displayW = previewC.getBoundingClientRect().width;
    const scale = FW / displayW;
    slZoom.value = zoom;
    slX.value = Math.max(-200, Math.min(200, panX * scale));
    slY.value = Math.max(-200, Math.min(200, panY * scale));

    clearTimeout(db);
    db = setTimeout(renderPreview, 16);
  }, { passive: false });

  previewC.addEventListener('touchend', e => {
    lastTouches = e.touches.length > 0 ? getTouchState(e) : null;
  });
}

btnGif.addEventListener('click',async()=>{
  if(!lastFaceImg)return;
  btnGif.disabled=true;
  const zoom=parseFloat(slZoom.value),nx=parseFloat(slX.value),ny=parseFloat(slY.value);
  const encoder=new GIFEncoder(FW,FH);
  const tmpC=document.createElement('canvas');tmpC.width=FW;tmpC.height=FH;
  const tmpCtx=tmpC.getContext('2d');

  // Frames 0-38: Kevin's reaction, include as-is
  // Frame 39: original girl close-up, skip
  // Frame 40: the frame we composite into, hold for 1 second
  for(let i=0;i<=38;i++){
    tmpCtx.drawImage(frameImages[i],0,0,FW,FH);
    encoder.addFrame(tmpCtx.getImageData(0,0,FW,FH),FRAMES_DATA[i].duration);
    if(i%5===0){statusEl.textContent=`Processing frame ${i+1}/39…`;await new Promise(r=>setTimeout(r,0));}
  }

  const composite=warpFaceOnto(frameImages[40],lastFaceImg,zoom,nx,ny);
  tmpCtx.drawImage(composite,0,0);
  const compData=tmpCtx.getImageData(0,0,FW,FH);
  for(let i=0;i<10;i++) encoder.addFrame(compData,100);

  statusEl.textContent='Encoding GIF…';
  await new Promise(r=>setTimeout(r,0));

  statusEl.textContent='Finalizing…';
  await new Promise(r=>setTimeout(r,0));

  const bytes=encoder.encode();

  // Convert to base64 data URL - more reliable than blob URLs cross-browser
  let binary='';
  for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
  const b64=btoa(binary);
  const dataUrl='data:image/gif;base64,'+b64;

  // Also make a blob for the download button (handles large files better)
  const blob=new Blob([bytes],{type:'image/gif'});
  const blobUrl=URL.createObjectURL(blob);

  btnDownload.href=blobUrl;
  gifImg.src=dataUrl;
  btnGif.disabled=false;
  showStep('result');
});

showStep('upload');
</script>
